name: laravel test

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: sipantauku_test
      DB_USERNAME: testing_user
      DB_PASSWORD: testing_password

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sipantauku_test
          MYSQL_USER: testing_user
          MYSQL_PASSWORD: testing_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup php
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extension: mbstring, dom, fileinfo, mysql, zip
          coverage: xdebug

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: copy env file
        run: cp .env.example .env

      - name: generate application key
        run: php artisan key:generate

      - name: run migration
        run: php artisan migrate --force

      - name: run test
        run: vendor/bin/pest tests/Unit
